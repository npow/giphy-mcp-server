[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "giphy-mcp-server"
version = "0.1.0"
description = "MCP server for the Giphy API -- search, trending, and random GIFs as tools for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
giphy-mcp-server = "giphy_mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]
